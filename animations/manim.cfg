# Manim Community reads manim.cfg from the directory it runs in, so run it from
# here; animations/render.py does.
#
# The background matches the existing diagrams in static/ (#1c1c1c), and 720p
# is enough for the 64rem wide column the image render hook puts videos in.
# media/ holds Manim's intermediate files and is gitignored; only the scrubbed
# outputs render.py writes into static/ are committed.

[CLI]
background_color = #1c1c1c
pixel_width = 1280
pixel_height = 720
frame_rate = 30
media_dir = ./media
progress_bar = none
verbosity = WARNING
