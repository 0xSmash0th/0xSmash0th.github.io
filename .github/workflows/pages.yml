name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job needs nothing but read, and only the deploy
# job gets the Pages write token. A compromised action in the build step
# therefore cannot publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately. Without a pin, a Hugo release breaks the build on
      # an unrelated day, and template behaviour can change under you.
      HUGO_VERSION: 0.165.0
    steps:
      # Actions are pinned to major tags. For a stricter supply chain, pin each
      # to a full commit SHA instead — a tag can be moved, a SHA cannot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for .Lastmod if you ever enable it

      - name: Install Hugo (checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          # Download under the asset's real name: `sha256sum -c` opens the file
          # named in the checksum line, so saving it as hugo.deb made it look
          # for a file that did not exist. -f makes a bad URL fail here loudly.
          curl -fsSL --retry 3 -o "${deb}" "${base}/${deb}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep "${deb}\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "./${deb}"

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
